[project]
name = "tianshu"
version = "0.2.0"
description = "天枢 Agent — 中国本土独立自主通用 AI Agent 框架"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "yonghangyuan"}]
keywords = ["ai-agent", "cli", "deepseek", "llm", "agent-framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
tui = ["prompt_toolkit>=3.0"]
browser = ["websockets>=12.0"]  # Edge CDP 渲染需要
all = ["prompt_toolkit>=3.0", "websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/yonghangyuan/tianshu"
Repository = "https://github.com/yonghangyuan/tianshu"
Issues = "https://github.com/yonghangyuan/tianshu/issues"

[project.scripts]
tianshu = "tianshu.main:main"
tianshu-cli = "tianshu.main:main"
tianshu-server = "tianshu.gateway.server:main"
tianshu-feishu = "tianshu.gateway.feishu:main"
tianshu-wechat = "tianshu.gateway.wechat:main"
tianshu-qqbot  = "tianshu.gateway.qqbot:main"
tianshu-wechat-mp = "tianshu.gateway.wechat_mp:main"
tianshu-tui = "tianshu.gateway.tui:main"


[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
