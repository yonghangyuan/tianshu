<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天枢 · 星群</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0e27;color:#c9d1d9;height:100vh;display:flex}
nav{width:220px;background:#131a35;padding:16px;border-right:1px solid #1e2a4a;display:flex;flex-direction:column}
nav h2{font-size:16px;color:#e2c860;margin-bottom:12px}
nav .stat{font-size:12px;color:#64748b;padding:3px 0}
#members{margin-top:auto;font-size:12px}
#members h3{color:#94a3b8;margin-bottom:6px}
.member{padding:3px 0;display:flex;gap:4px;align-items:center}
.member .dot{width:6px;height:6px;border-radius:3px;background:#4ade80;display:inline-block}
main{flex:1;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:16px}
.msg{margin-bottom:10px;display:flex;gap:8px}
.msg .av{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0;color:#fff}
.msg.bot .av{background:#1e3a5f}
.msg.user .av{background:#1e40af}
.msg .bd{flex:1}
.msg .nm{font-size:11px;color:#64748b;margin-bottom:2px}
.msg .tx{background:#131a35;padding:7px 10px;border-radius:6px;font-size:13px;line-height:1.5;word-break:break-word}
.msg.user .tx{background:#1e40af}
.msg.bot .tx{background:#1e293b}
.tool{font-size:11px;color:#475569;padding:3px 10px;display:flex;gap:4px;align-items:center}
.tool .dot{width:5px;height:5px;border-radius:3px}
.tool .dot.ok{background:#4ade80}.tool .dot.fail{background:#ef4444}
.event{text-align:center;color:#475569;font-size:11px;padding:3px 0}
#bar{display:flex;gap:6px;padding:10px 16px;border-top:1px solid #1e2a4a;background:#0f1630}
#bar input{padding:8px;border-radius:6px;border:1px solid #1e2a4a;background:#131a35;color:#c9d1d9;font-size:13px}
#ni{width:70px}#mi{flex:1}
button{padding:8px 16px;border-radius:6px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:13px;font-weight:600}
</style>
</head>
<body>
<nav>
  <h2>天枢·星群</h2>
  <div class="stat" id="model">模型: -</div>
  <div class="stat" id="skills">工具: -</div>
  <div id="members"><h3>在线</h3></div>
</nav>
<main>
  <div id="chat"><div class="event">已连接到星群——@天枢 即可召唤</div></div>
  <div id="bar">
    <input id="ni" placeholder="名字" value="">
    <input id="mi" placeholder="@天枢 帮我..." onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</main>
<script>
const S = localStorage;
let ws, name = S.getItem('ts_name')||'';
document.getElementById('ni').value = name;
document.getElementById('ni').onchange = function(){name=this.value;S.setItem('ts_name',name)};

function conn(){
  ws = new WebSocket('ws://'+location.host+'/ws');
  ws.onopen = ()=>evt('已连接');
  ws.onmessage = e=>{
    const m=JSON.parse(e.data);
    if(m.type==='chat') msg(m.from==='天枢'?'bot':'user', m.from, m.content);
    else if(m.type==='tool') toolEvt(m.name, m.ok);
    else if(m.type==='join'){evt(m.from+' 加入');updMembers(m.members);}
    else if(m.type==='status'){document.getElementById('model').textContent='模型: '+m.models;document.getElementById('skills').textContent='工具: '+m.skills;}
  };
  ws.onclose = ()=>{evt('断开,3s后重连...');setTimeout(conn,3000);};
}

function send(){
  const mi=document.getElementById('mi'), tx=mi.value.trim();
  if(!tx||!ws)return;
  const n=document.getElementById('ni').value.trim()||'匿名';
  name=n; S.setItem('ts_name',name);
  ws.send(JSON.stringify({type:'chat',from:name,content:tx}));
  msg('user',name,tx); mi.value='';
}

function msg(cls,from,tx,){
  const d=document.createElement('div');d.className='msg '+cls;
  const av=from==='天枢'?'枢':(from[0]||'?');
  d.innerHTML=`<div class="av">${av}</div><div class="bd"><div class="nm">${from}</div><div class="tx">${e(tx)}</div></div>`;
  document.getElementById('chat').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function evt(tx){const d=document.createElement('div');d.className='event';d.textContent=tx;document.getElementById('chat').appendChild(d)}
function toolEvt(nm,ok){const d=document.createElement('div');d.className='tool';d.innerHTML=`<div class="dot ${ok?'ok':'fail'}"></div> ${nm}`;document.getElementById('chat').appendChild(d)}
function updMembers(l){(l||[]).forEach(m=>{if(!document.getElementById('m-'+m)){const d=document.createElement('div');d.className='member';d.id='m-'+m;d.innerHTML=`<span class="dot"></span> ${e(m)}`;document.getElementById('members').appendChild(d)}})}
function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
conn();
</script>
</body>
</html>
