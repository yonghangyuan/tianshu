<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天枢 · 星群</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0e27;color:#c9d1d9;height:100vh;display:flex}
nav{width:220px;background:#131a35;padding:16px;border-right:1px solid #1e2a4a;display:flex;flex-direction:column}
nav h2{font-size:16px;color:#e2c860;margin-bottom:12px}
nav .stat{font-size:12px;color:#64748b;padding:3px 0}
#members{margin-top:auto;font-size:12px}
#members h3{color:#94a3b8;margin-bottom:6px}
.member{padding:3px 0;display:flex;gap:4px;align-items:center}
.member .dot{width:6px;height:6px;border-radius:3px;background:#4ade80;display:inline-block}
main{flex:1;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:16px}
.msg{margin-bottom:10px;display:flex;gap:8px}
.msg .av{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0;color:#fff}
.msg.bot .av{background:#1e3a5f}
.msg.user .av{background:#1e40af}
.msg .bd{flex:1}
.msg .nm{font-size:11px;color:#64748b;margin-bottom:2px}
.msg .tx{background:#131a35;padding:7px 10px;border-radius:6px;font-size:13px;line-height:1.5;word-break:break-word}
.msg.user .tx{background:#1e40af}
.msg.bot .tx{background:#1e293b}
.tool{font-size:11px;color:#475569;padding:3px 10px;display:flex;gap:4px;align-items:center}
.tool .dot{width:5px;height:5px;border-radius:3px}
.tool .dot.ok{background:#4ade80}.tool .dot.fail{background:#ef4444}
.event{text-align:center;color:#475569;font-size:11px;padding:3px 0}
#bar{display:flex;gap:6px;padding:10px 16px;border-top:1px solid #1e2a4a;background:#0f1630}
#bar input{padding:8px;border-radius:6px;border:1px solid #1e2a4a;background:#131a35;color:#c9d1d9;font-size:13px}
#ni{width:70px}#mi{flex:1}
button{padding:8px 16px;border-radius:6px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:13px;font-weight:600}
</style>
</head>
<body>
<nav>
  <h2>天枢·星群</h2>
  <div class="stat" id="model">模型: -</div>
  <div class="stat" id="skills">工具: -</div>
  <div id="members"><h3>在线</h3></div>
</nav>
<main>
  <div id="chat"><div class="event">已连接到星群——@天枢 即可召唤</div></div>
  <div id="bar">
    <input id="ni" placeholder="名字" value="">
    <div style="position:relative;flex:1">
      <input id="mi" placeholder="输入消息，@ 提及某人..." onkeypress="if(event.key==='Enter')send()" oninput="onInput()" onkeydown="onKey(event)" autocomplete="off">
      <div id="ac" style="display:none;position:absolute;bottom:100%;left:0;right:0;background:#1e293b;border:1px solid #334155;border-radius:6px;max-height:160px;overflow-y:auto;z-index:99"></div>
    </div>
    <input type="file" id="fi" style="display:none" onchange="uploadFile()">
    <button onclick="document.getElementById('fi').click()" style="background:#334155">📎</button>
    <button onclick="send()">发送</button>
  </div>
</main>
<script>
// 轻量 Markdown 渲染（零依赖）
function md2html(s){
  s = String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/^# (.+)$/gm,'<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/`([^`]+)`/g,'<code style="background:#1e293b;padding:1px 4px;border-radius:3px">$1</code>')
    .replace(/^\- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,function(m){return '<ul>'+m+'</ul>'})
    .replace(/───+/g,'<hr>');
  // 表格: | a | b | → <table>
  if(s.includes('|')){
    let lines=s.split('\n'),table=[],inTable=false,result=[];
    for(let l of lines){
      if(l.match(/^\|.+\|$/)){
        if(!inTable){inTable=true;table=['<table>'];}
        let cells=l.split('|').filter(c=>c.trim());
        let tag=table.length===2?'th':'td';
        table.push('<tr>'+cells.map(c=>'<'+tag+'>'+c.trim()+'</'+tag+'>').join('')+'</tr>');
      }else{
        if(inTable){inTable=false;table.push('</table>');result.push(table.join(''));table=[];}
        result.push(l);
      }
    }
    if(inTable){table.push('</table>');result.push(table.join(''));}
    s=result.join('\n');
  }
  return s.replace(/\n/g,'<br>');
}

const S = localStorage;
let name = S.getItem('ts_name')||'';
let lastId = 0;
let shown = new Set();
document.getElementById('ni').value = name;
document.getElementById('ni').onchange = function(){name=this.value;S.setItem('ts_name',name)};

function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function addMsg(cls,from,tx,id,time){
  if(shown.has(id)) return; shown.add(id);
  const d=document.createElement('div');d.className='msg '+cls;
  const av=from==='天枢'?'枢':(from[0]||'?');
  const nameCls = from===name?' (你)':'';
  let body = from==='天枢' ? md2html(tx) : e(tx);
  // 文件消息 → 渲染为下载链接
  if(tx.includes('📎 上传了文件:')){
    const fn=tx.split('📎 上传了文件:')[1].trim();
    body='📎 <a href="/chat/download/'+fn+'" style="color:#60a5fa">'+fn+'</a> (点击下载)';
  }
  const ts = time ? new Date(time*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) : '';
  d.innerHTML='<div class="av">'+av+'</div><div class="bd"><div class="nm">'+e(from)+nameCls+' <span style="color:#475569;font-size:10px">'+ts+'</span></div><div class="tx">'+body+'</div></div>';
  const chat=document.getElementById('chat');
  chat.appendChild(d); d.scrollIntoView({behavior:'smooth'});
  while(chat.children.length>100) chat.removeChild(chat.firstChild);
}

async function poll(){
  try{
    const resp = await fetch('/chat/messages?since='+lastId);
    const data = await resp.json();
    if(data.users) window._chatUsers=data.users;
    for(const m of data.messages||[]){
      if(m.id>lastId) lastId=m.id;
      const cls = m.from==='天枢'?'bot':'user';
      addMsg(cls, m.from, m.content, m.id, m.time);
    }
  }catch(e){}
}
setInterval(poll, 1500);

async function uploadFile(){
  const fi=document.getElementById('fi'), file=fi.files[0];
  if(!file)return;
  if(file.size>50*1024*1024){alert('文件不能超过50MB');return}
  const n=document.getElementById('ni').value.trim()||'匿名';
  const fd=new FormData();fd.append('file',file);fd.append('sender',n);
  try{
    const r=await fetch('/chat/upload',{method:'POST',body:fd});
    if(!r.ok){const d=await r.json();alert('上传失败: '+(d.detail||r.status))}
    else{
      // 广播上传消息到群聊
      const data=await r.json();
      msg('user',n,'📎 上传了文件: '+data.filename);
    }
    fi.value='';poll();
  }catch(e){alert('上传失败: 网络错误')}
}

// @ 自动补全
let acIdx=-1,acList=[],acBase='';
function onInput(){
  const mi=document.getElementById('mi'),ac=document.getElementById('ac');
  const v=mi.value,pos=mi.selectionStart,atPos=v.lastIndexOf('@',pos);
  if(atPos>=0&&(atPos===0||v[atPos-1]===' ')){
    const q=v.slice(atPos+1,pos).toLowerCase();
    acBase=v.slice(0,atPos);
    acList=['天枢'].concat((window._chatUsers||[]).filter(u=>u!=='天枢'&&u!==name)).filter(u=>u.toLowerCase().includes(q));
    if(acList.length){acIdx=0;renderAc();ac.style.display='block';return}
  }ac.style.display='none';acIdx=-1;
}
function renderAc(){
  document.getElementById('ac').innerHTML=acList.map((u,i)=>'<div style="padding:5px 8px;cursor:pointer;font-size:13px;'+(i===acIdx?'background:#2563eb;border-radius:4px':'')+'" onmousedown="pickAc('+i+')">@'+u+'</div>').join('');
}
function pickAc(i){
  const mi=document.getElementById('mi');mi.value=acBase+'@'+acList[i]+' ';document.getElementById('ac').style.display='none';mi.focus();
}
function onKey(e){
  const ac=document.getElementById('ac');if(ac.style.display==='none')return;
  if(e.key==='ArrowDown'){e.preventDefault();acIdx=(acIdx+1)%acList.length;renderAc()}
  else if(e.key==='ArrowUp'){e.preventDefault();acIdx=(acIdx-1+acList.length)%acList.length;renderAc()}
  else if(e.key==='Enter'&&acIdx>=0){e.preventDefault();pickAc(acIdx)}
  else if(e.key==='Escape'){ac.style.display='none';acIdx=-1}
}

async function send(){
  const mi=document.getElementById('mi'), tx=mi.value.trim();
  if(!tx)return;
  const n=document.getElementById('ni').value.trim()||'匿名';
  name=n; S.setItem('ts_name',name);
  mi.value='';

  try{
    await fetch('/chat/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sender:name,content:tx})
    });
  }catch(e){}
  poll(); // 立刻刷新
}

fetch('/health').then(r=>r.json()).then(d=>{
  document.getElementById('model').textContent='模型: '+d.models;
  document.getElementById('skills').textContent='工具: '+d.skills;
});
poll();
</script>
</body>
</html>
