<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat / TianShu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
header{background:#1e293b;padding:12px 20px;font-size:16px;border-bottom:1px solid #334155}
header b{color:#38bdf8}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:8px;max-width:85%;line-height:1.6;white-space:pre-wrap}
.user{background:#1e40af;align-self:flex-end}
.agent{background:#1e293b;align-self:flex-start}
.think{background:#1a1a2e;border:1px solid #333;font-size:13px;color:#94a3b8;margin-top:4px;padding:8px 12px;border-radius:6px;cursor:pointer}
.think summary{color:#64748b;font-size:12px}
.think[open] summary{color:#38bdf8}
.tool{background:#1a2e1a;color:#4ade80;font-size:13px;align-self:flex-start;padding:6px 12px}
#bar{display:flex;gap:8px;padding:12px 16px;background:#1e293b;border-top:1px solid #334155}
#bar input{flex:1;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:15px}
#bar button{padding:12px 20px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer}
#timer{color:#64748b;font-size:13px;padding:4px 0}
</style></head>
<body>
<header>TianShu Chat | <b id="model">-</b></header>
<div id="msgs"></div>
<div id="timer"></div>
<div id="bar">
  <input id="inp" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
  <button onclick="send()">Send</button>
</div>
<script>
let timerInterval=null;
function startTimer(){const s=Date.now();document.getElementById('timer').textContent='Thinking...';timerInterval=setInterval(()=>{const e=((Date.now()-s)/1000).toFixed(0);document.getElementById('timer').textContent='Thought for '+e+'s'},200)}
function stopTimer(){clearInterval(timerInterval);document.getElementById('timer').textContent=''}

async function send(){
  const inp=document.getElementById('inp'),text=inp.value.trim();if(!text)return;
  add('user',text);inp.value='';const div=add('agent','');
  startTimer();
  const resp=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:text})});
  stopTimer();
  const data=await resp.json();
  if(data.error){div.textContent='Error: '+data.error;return}
  if(data.tool_calls&&data.tool_calls.length)data.tool_calls.forEach(t=>{add('tool','TOOL: '+t.name+(t.success?'':' FAIL'))});
  div.textContent=data.content||'(empty)';
}
function add(role,text){const d=document.createElement('div');d.className='msg '+role;if(text)d.textContent=text;document.getElementById('msgs').appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
</script></body></html>
