<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天枢 · 地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0a0e27; height: 100vh; display: flex; flex-direction: column; }
.header { background: #131a35; padding: 10px 16px; color: #e2c860; font-size: 15px; font-weight: 700; border-bottom: 1px solid #1e2a4a; display: flex; align-items: center; gap: 10px; }
.header .sub { font-size: 11px; color: #64748b; font-weight: 400; }
#map { flex: 1; }
.controls { background: #131a35; padding: 12px 16px; border-top: 1px solid #1e2a4a; display: flex; gap: 8px; flex-wrap: wrap; }
.controls input { background: #0f1630; border: 1px solid #1e2a4a; color: #c9d1d9; padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 130px; }
.controls button { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.controls button:hover { background: #1d4ed8; }
.controls .sep { color: #334155; display: flex; align-items: center; font-size: 12px; }
.info { color: #94a3b8; font-size: 11px; padding: 4px 16px; background: #0a0e27; display: flex; gap: 16px; }
</style>
</head>
<body>
<div class="header">
  🗺️ 天枢 · 地图导航
  <span class="sub">| 路径规划可视化</span>
</div>
<div class="info">
  <span id="dist">距离: --</span>
  <span id="bearing">方向: --</span>
</div>
<div id="map"></div>
<div class="controls">
  <span class="sep">起点</span>
  <input id="from_lat" placeholder="纬度" value="39.9042">
  <input id="from_lng" placeholder="经度" value="116.4074">
  <span class="sep">终点</span>
  <input id="to_lat" placeholder="纬度" value="39.9142">
  <input id="to_lng" placeholder="经度" value="116.4274">
  <button onclick="plan()">路径规划</button>
  <button onclick="locate()" style="background:#1e293b">📍 我的位置</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([39.9042, 116.4074], 14);
// 多层瓷砖源——中国可用
const tiles = {
  // 高德卫星图 (无需 Key 的低清版)
  'amap_img': L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
    subdomains: '1234', attribution: '© 高德地图', maxZoom: 18,
  }),
  // CartoDB Voyager (国际可用)
  'cartodb': L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', attribution: '© CartoDB', maxZoom: 19,
  }),
  // OpenStreetMap 热力式 (备用)
  'osm_hot': L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
    subdomains: 'ab', attribution: '© OSM', maxZoom: 19,
  }),
  // ESRI 卫星图 (备用)
  'esri_sat': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© ESRI', maxZoom: 17,
  }),
};
// 默认用 CartoDB (最广兼容), 失败则换 ESRI
const defaultTile = tiles['cartodb'];
defaultTile.addTo(map);

// 右下角图层切换
const layerControl = L.control.layers(
  { '默认 (CartoDB)': defaultTile },
  { '高德卫星图': tiles['amap_img'], 'ESRI 卫星图': tiles['esri_sat'], 'OSM 热力': tiles['osm_hot'] },
  { position: 'bottomright' }
).addTo(map);

let markers = [];
let polyline = null;

async function plan() {
  const from_lat = document.getElementById('from_lat').value;
  const from_lng = document.getElementById('from_lng').value;
  const to_lat = document.getElementById('to_lat').value;
  const to_lng = document.getElementById('to_lng').value;

  // Clear old markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (polyline) { map.removeLayer(polyline); polyline = null; }

  // Add start/end markers
  const start = [parseFloat(from_lat), parseFloat(from_lng)];
  const end = [parseFloat(to_lat), parseFloat(to_lng)];
  markers.push(L.marker(start).addTo(map).bindPopup('起点'));
  markers.push(L.marker(end).addTo(map).bindPopup('终点'));

  // Draw straight line
  polyline = L.polyline([start, end], { color: '#e2c860', weight: 3, dashArray: '8 4' }).addTo(map);

  // Fit bounds
  map.fitBounds([start, end], { padding: [50, 50] });

  // Calculate distance
  const R = 6371000;
  const dLat = (end[0] - start[0]) * Math.PI / 180;
  const dLng = (end[1] - start[1]) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(start[0]*Math.PI/180)*Math.cos(end[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  const y = Math.sin(dLng) * Math.cos(end[0]*Math.PI/180);
  const x = Math.cos(start[0]*Math.PI/180)*Math.sin(end[0]*Math.PI/180) - Math.sin(start[0]*Math.PI/180)*Math.cos(end[0]*Math.PI/180)*Math.cos(dLng);
  const bearing = (Math.atan2(y, x)*180/Math.PI + 360) % 360;
  const dirs = ['北','东北','东','东南','南','西南','西','西北'];

  document.getElementById('dist').textContent = `距离: ${dist.toFixed(0)}m`;
  document.getElementById('bearing').textContent = `方向: ${dirs[Math.round(bearing/45)%8]} (${bearing.toFixed(0)}°)`;
}

function locate() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById('from_lat').value = pos.coords.latitude.toFixed(4);
      document.getElementById('from_lng').value = pos.coords.longitude.toFixed(4);
    });
  } else {
    alert('浏览器不支持定位');
  }
}

plan(); // Initial render

// ── 情报标注加载 ──
function loadPoints(points) {
  if (!points || !points.length) return;
  // 清除现有标记
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  // 添加情报标注点
  const bounds = [];
  points.forEach((p, i) => {
    if (!p.lat || !p.lng) return;
    const icon = p.icon || (p.category === 'military' ? '🔴' : p.category === 'port' ? '⚓' : '📍');
    const m = L.marker([p.lat, p.lng], {
      icon: L.divIcon({
        html: icon,
        className: 'emoji-marker',
        iconSize: [30, 30],
        popupAnchor: [0, -15],
      }),
    }).addTo(map);
    m.bindPopup(`<b>${p.name || 'Point '+(i+1)}</b><br>${p.desc || ''}`);
    if (p.source) m.bindPopup(m.getPopup().getContent() + `<br><small style=color:#64748b>来源: ${p.source}</small>`);
    markers.push(m);
    bounds.push([p.lat, p.lng]);
  });
  if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [50, 50] });
  } else if (bounds.length === 1) {
    map.setView(bounds[0], 13);
  }
}

// 加载预设情报点 (来自 /map?points=...)
if (window._PRESET_POINTS) {
  loadPoints(window._PRESET_POINTS);
}

// URL hash 中的 GeoJSON
if (location.hash && location.hash.startsWith('#points=')) {
  try {
    const pts = JSON.parse(decodeURIComponent(location.hash.slice(8)));
    loadPoints(pts);
  } catch(e) {}
}
</script>
</body>
</html>
